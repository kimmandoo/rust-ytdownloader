name: Release on Commit

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

env:
  FLUTTER_CHANNEL: stable
  GH_REPO: ${{ github.repository }}

jobs:
  prepare-release:
    name: Prepare draft release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Generate release tag
        id: tag
        shell: bash
        run: |
          VERSION=$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml | head -1)
          SHORT_SHA=$(printf '%s' "${GITHUB_SHA}" | cut -c1-7)
          echo "tag=v${VERSION}-${GITHUB_RUN_NUMBER}-${SHORT_SHA}" >> "${GITHUB_OUTPUT}"
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          cat > release-notes.md <<'EOF'
          ## Spull Flutter Release

          A Dart + Flutter desktop media downloader for Windows, macOS, and Linux.

          macOS artifacts are ad-hoc signed for local distribution. They are not notarized.
          EOF
          gh release create "${TAG}" --draft --title "Release ${TAG}" --notes-file release-notes.md

  build:
    name: Build ${{ matrix.name }}
    needs: prepare-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x86_64
            os: windows-latest
            target: windows
            artifact: build/windows/x64/runner/Release/spull.exe
            asset_name: spull-windows-x86_64.exe
          - name: Linux x86_64
            os: ubuntu-latest
            target: linux
            artifact: build/linux/x64/release/bundle
            asset_name: spull-linux-x86_64.tar.gz
          - name: macOS Apple Silicon
            os: macos-latest
            target: macos
            artifact: build/macos/Build/Products/Release/spull.app
            asset_name: spull-macos-aarch64.app.zip
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - name: Install Linux build dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev
      - name: Enable desktop target
        run: flutter config --enable-${{ matrix.target }}-desktop
      - name: Install Dart packages
        run: flutter pub get
      - name: Build Flutter release
        run: flutter build ${{ matrix.target }} --release
      - name: Prepare release asset
        shell: bash
        env:
          ARTIFACT: ${{ matrix.artifact }}
          ASSET_NAME: ${{ matrix.asset_name }}
        run: |
          test -e "${ARTIFACT}"
          mkdir -p release-assets
          if [[ "${ASSET_NAME}" == *.zip ]]; then
            ditto -c -k --sequesterRsrc --keepParent "${ARTIFACT}" "release-assets/${ASSET_NAME}"
          elif [[ "${ASSET_NAME}" == *.tar.gz ]]; then
            tar -czf "release-assets/${ASSET_NAME}" -C "$(dirname "${ARTIFACT}")" "$(basename "${ARTIFACT}")"
          else
            cp "${ARTIFACT}" "release-assets/${ASSET_NAME}"
          fi
      - name: Upload release asset
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
          ASSET_NAME: ${{ matrix.asset_name }}
        run: gh release upload "${TAG}" "release-assets/${ASSET_NAME}" --clobber

  publish-release:
    name: Publish release
    needs:
      - prepare-release
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
        run: gh release edit "${TAG}" --draft=false --prerelease=false
