name: Release on Commit

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  GH_REPO: ${{ github.repository }}

jobs:
  prepare-release:
    name: Prepare draft release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get version from Cargo.toml
        id: get_version
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Generate release tag
        id: tag
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          TAG="v${{ steps.get_version.outputs.version }}-${{ github.run_number }}-${SHORT_SHA}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          retry() {
            delay=3
            for attempt in 1 2 3 4 5; do
              "$@" && return 0
              if [ "$attempt" = 5 ]; then
                return 1
              fi
              sleep "$delay"
              delay=$((delay * 2))
            done
          }

          cat > release-notes.md <<'EOF'
          ## Auto Release

          **Commit:** `${{ github.sha }}`
          **Message:** ${{ github.event.head_commit.message }}
          **Author:** ${{ github.event.head_commit.author.name }}
          **Date:** ${{ github.event.head_commit.timestamp }}

          ### Downloads

          | Platform | File |
          |----------|------|
          | Windows x86_64 | `rust-ytdownloader-windows-x86_64.exe` |
          | macOS Intel | `rust-ytdownloader-macos-x86_64` |
          | macOS Apple Silicon | `rust-ytdownloader-macos-aarch64` |
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            retry gh release edit "$TAG" --draft=true --prerelease=false --notes-file release-notes.md
          else
            retry gh release create "$TAG" --draft --title "Release $TAG" --notes-file release-notes.md
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: prepare-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: rust-ytdownloader-tauri.exe
            asset_name: rust-ytdownloader-windows-x86_64.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: rust-ytdownloader-tauri
            asset_name: rust-ytdownloader-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: rust-ytdownloader-tauri
            asset_name: rust-ytdownloader-macos-aarch64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install openssl pkg-config

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          workspaces: |
            src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build release binary
        shell: bash
        run: |
          retry() {
            delay=10
            for attempt in 1 2 3; do
              "$@" && return 0
              if [ "$attempt" = 3 ]; then
                return 1
              fi
              sleep "$delay"
              delay=$((delay * 2))
            done
          }

          retry npm run tauri build -- --target "${{ matrix.target }}"

      - name: Upload binary to draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
          ASSET_PATH: src-tauri/target/${{ matrix.target }}/release/${{ matrix.artifact_name }}
          ASSET_NAME: ${{ matrix.asset_name }}
        run: |
          retry() {
            delay=3
            for attempt in 1 2 3 4 5; do
              "$@" && return 0
              if [ "$attempt" = 5 ]; then
                return 1
              fi
              sleep "$delay"
              delay=$((delay * 2))
            done
          }

          test -f "$ASSET_PATH"
          retry gh release upload "$TAG" "$ASSET_PATH#$ASSET_NAME" --clobber

  publish-release:
    name: Publish release
    needs:
      - prepare-release
      - build
    runs-on: ubuntu-latest

    steps:
      - name: Publish draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          retry() {
            delay=3
            for attempt in 1 2 3 4 5; do
              "$@" && return 0
              if [ "$attempt" = 5 ]; then
                return 1
              fi
              sleep "$delay"
              delay=$((delay * 2))
            done
          }

          retry gh release edit "$TAG" --draft=false --prerelease=false
